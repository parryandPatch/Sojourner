# SOJOURNER frontend nginx configuration.
#
# Two jobs: serve the built bundle, and reverse-proxy the API so the whole app runs on one
# origin. Single-page routing means unknown paths fall through to index.html.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle is content-hashed, so it can be cached indefinitely. index.html must not
    # be, or a deploy would never reach a returning browser.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # WebSocket live feed. proxy_http_version 1.1 and the explicit Upgrade headers are what
    # make the handshake work; without them the backend sees a plain GET and never upgrades.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Plan generation is synchronous and budgeted at 8 seconds per solve, so the
        # default 60s read timeout is comfortable but not unbounded.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # This is a synthetic demonstration. There is no reason for a third party to load
    # anything from this origin, and the app makes no outbound requests.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}